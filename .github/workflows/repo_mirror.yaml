name: Run repo mirror
on:
  workflow_dispatch:
    inputs:
      mapDBCommitHash:
        description: 'Force checkout of map to HASH version'
        required: false
  schedule:
    - cron: '25 */3 * * *'
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  mirror:
    if: "!contains(github.event.head_commit.message, 'Repo updates within last')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Rollback mapDB for testing
        run: git checkout ${{ github.event.inputs.mapDBCommitHash }} -- map_files/mapdb.json
        if: "${{ github.event.inputs.mapDBCommitHash != '' }}"

      - name: Setup ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: run mirror script
        run: bundle exec ruby lichless_repo.rb
        timeout-minutes: 2

      - name: Update JINX manifest
        continue-on-error: true
        run: |
          wget --tries=5 --retry-connrefused --retry-on-host-error https://github.com/elanthia-online/jinxp/releases/download/v0.4.0/jinxp \
          && chmod +x jinxp \
          && ./jinxp -i map_files
          sed -i 's|/assets/|/map_files/|g' dist/manifest.json
          mv dist/manifest.json ./
          mv dist/headers ./

      - name: Check for map_files changes
        id: check_changes
        run: |
          if git diff --quiet map_files && git diff --cached --quiet map_files; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add map_files
          git add headers
          git add manifest.json
          git add report.txt
          git add updated_at.txt
          if [ -z "$(git status --porcelain)" ]; then 
            echo "No changes to commit"
          else 
            git commit -m "Repo updates within last 3 hours"
          fi

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@4cc74773234f74829a8c21bc4d69dd4be9cfa599 # v1.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
